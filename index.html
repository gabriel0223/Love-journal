<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1B21">
<title>Our Love Journal</title>
<script>
/* If anything breaks, show it on screen instead of a blank page */
window.addEventListener("error", function(ev){
  var box=document.getElementById("fatal");
  if(!box){
    box=document.createElement("pre"); box.id="fatal";
    box.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:999;margin:0;padding:12px 14px;background:#E23D6A;color:#fff;font:13px/1.45 monospace;white-space:pre-wrap;border-radius:8px;";
    (document.body||document.documentElement).appendChild(box);
  }
  box.textContent="Something broke: "+(ev.message||"unknown error")+(ev.lineno?" (line "+ev.lineno+")":"");
});
</script>
<!-- Your Supabase keys live in config.js, so app updates never touch them -->
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Yuji+Syuku&family=Yomogi&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  color-scheme:dark;
  --page:#1C1B21; --page-2:#2A2931; --page-line:#403E4A;
  --chalk:#F7F3EA; --chalk-soft:#BDB7C6; --chalk-faint:#8A8494;
  --paper:#FBF8F1; --paper-2:#EFE9DC; --paper-line:#D8D0C2;
  --ink:#1E1C24; --ink-soft:#57525F; --ink-faint:#8C8694;
  --rose:#E23D6A; --gold:#FFC857;
  --hand:"Caveat","Yomogi","Segoe Print","Bradley Hand",cursive;
  --ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; color:var(--chalk); font-family:var(--ui); font-size:15px; line-height:1.6;
  background-color:var(--page);
  background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.3px);
  background-size:5px 5px;
  -webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);
}
img{max-width:100%;}
[hidden]{display:none !important;}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--gold); outline-offset:3px;}
.wrap{max-width:980px; margin:0 auto; padding-inline:18px; padding-block:22px 120px;}

/* tape color + soft tint per category are set from the script */

/* ---------- header ---------- */
.route{display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700; color:var(--chalk-soft); letter-spacing:.04em;}
.route .ln{flex:0 1 80px; border-top:2px dashed var(--page-line);}
h1{font-family:var(--hand); font-weight:700; font-size:clamp(54px,14vw,86px); line-height:.9; margin:12px 0 4px; color:var(--chalk);}
.jp-sub{font-family:"Yomogi",cursive; font-size:18px; color:var(--gold); margin:0 0 10px;}
.lede{margin:0; color:var(--chalk-soft); max-width:46ch; font-size:14.5px;}
.stats{display:flex; gap:10px; flex-wrap:wrap; margin:22px 0 4px;}
@media (max-width:430px){ .stat{padding:4px 10px 6px; gap:6px;} .stat b{font-size:28px !important;} .stat span{font-size:11.5px !important;} }
.stat{
  background:var(--paper); color:var(--ink); padding:5px 14px 7px; border-radius:2px;
  box-shadow:0 8px 14px -8px rgba(0,0,0,.8); transform:rotate(var(--r,0deg));
  display:flex; align-items:baseline; gap:8px;
}
.stat b{font-family:var(--hand); font-size:34px; line-height:1; font-weight:700; font-variant-numeric:tabular-nums; color:var(--num,var(--ink));}
.stat span{font-size:12.5px; font-weight:700; color:var(--ink-soft);}
.whobar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:18px; padding-top:12px; border-top:1px dashed var(--page-line); font-size:13.5px; color:var(--chalk-soft);}
.whobar b{color:var(--chalk);}
.linkbtn{appearance:none; background:none; border:0; padding:0; cursor:pointer; font-size:13px; color:var(--chalk-soft); text-decoration:underline; text-underline-offset:3px;}
.linkbtn:hover{color:var(--chalk);}

/* ---------- search ---------- */
.search{position:relative; margin-top:22px;}
.search .mag{position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:15px; opacity:.75; pointer-events:none;}
#q{
  width:100%; font-family:inherit; font-size:16px; font-weight:500; color:var(--chalk);
  background:var(--page-2); border:1.5px solid var(--page-line); border-radius:999px;
  padding:11px 44px 11px 40px; -webkit-appearance:none; appearance:none;
}
#q::placeholder{color:var(--chalk-faint);}
#q::-webkit-search-cancel-button{display:none;}
#q-clear{
  position:absolute; right:7px; top:50%; transform:translateY(-50%);
  width:30px; height:30px; border-radius:50%; border:0; cursor:pointer;
  background:rgba(255,255,255,.12); color:var(--chalk); font-size:14px; line-height:1;
}
.tabs.searching{opacity:.45;}

/* ---------- tabs + filters ---------- */
.tabs{display:flex; gap:6px; margin:28px 0 0; border-bottom:3px solid var(--paper);}
.tab{
  appearance:none; border:0; cursor:pointer; background:var(--page-2); color:var(--chalk-soft);
  font-weight:700; font-size:14.5px; padding:9px 16px 7px; border-radius:10px 10px 0 0;
}
.tab[aria-selected="true"]{background:var(--paper); color:var(--ink);}
.filters{display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-top:12px;}
.filters.scroll{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-bottom:2px;}
.filters.scroll::-webkit-scrollbar{display:none;}
.chip{
  appearance:none; cursor:pointer; font-weight:700; font-size:13px; white-space:nowrap;
  padding:5px 12px; border-radius:999px; border:1.5px solid var(--page-line);
  background:transparent; color:var(--chalk); flex:none;
}
.chip[aria-pressed="true"]{background:var(--chalk); color:var(--ink); border-color:var(--chalk);}
select.mini{
  font-family:inherit; font-weight:700; font-size:13px; color:var(--chalk); background:var(--page);
  border:1.5px solid var(--page-line); border-radius:999px; padding:5px 10px; cursor:pointer;
}

/* ---------- polaroids ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:32px 16px; padding-top:30px;}
@media (min-width:700px){ .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:42px 28px;} }
.pol{
  position:relative; appearance:none; border:0; cursor:pointer; text-align:left; width:100%;
  color:var(--ink); background:var(--paper); padding:8px 8px 0; border-radius:2px;
  box-shadow:0 16px 24px -14px rgba(0,0,0,.9), 0 2px 4px rgba(0,0,0,.35);
  transform:rotate(var(--tilt,0deg)); transition:transform .18s ease;
  display:flex; flex-direction:column;
}
.pol:hover{transform:rotate(0deg) translateY(-3px) scale(1.02); z-index:3;}
.pol:active{transform:rotate(0deg) scale(.985);}
.pol .shot{position:relative; aspect-ratio:1/1; width:100%; max-width:100%; overflow:hidden; background:#121116;}
.pol .shot img{width:100%; height:100%; object-fit:cover; display:block;}
.ph{position:absolute; inset:0; background:var(--soft); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;}
.ph::after{content:""; position:absolute; inset:9px; border:1.5px dashed rgba(30,28,36,.2);}
.ph .big{font-size:46px; line-height:1;}
.ph .yet{font-family:var(--hand); font-size:20px; color:var(--ink-soft); line-height:1;}
.pol .cap{padding:9px 3px 11px; display:flex; flex-direction:column; gap:4px; min-height:78px;}
.pol .t{
  font-family:var(--hand); font-size:22px; line-height:1.05; font-weight:700; color:var(--ink);
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word;
}
.pol .m{font-size:11.5px; font-weight:700; color:var(--ink-faint); margin-top:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tape{
  position:absolute; top:-11px; left:50%; width:78px; height:24px; margin-left:-39px; z-index:2;
  transform:rotate(var(--tt,-4deg));
  background-color:var(--tape,#FFD35C);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.32) 0 5px,transparent 5px 11px);
  opacity:.9;
  clip-path:polygon(4% 0,96% 0,100% 18%,96% 36%,100% 54%,96% 72%,100% 90%,96% 100%,4% 100%,0 82%,4% 64%,0 46%,4% 28%,0 10%);
}
.flag{position:absolute; left:7px; bottom:6px; font-size:17px; line-height:1; filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));}
.count{position:absolute; right:6px; top:6px; background:rgba(10,10,14,.74); color:#fff; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px;}
/* 済 hanko seal */
.hanko{
  position:absolute; z-index:2; right:4px; top:-30px;
  width:50px; height:50px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:#C8281E; background:rgba(251,248,241,.9);
  border:2.5px solid currentColor;
  box-shadow:inset 0 0 0 2px rgba(251,248,241,.9), inset 0 0 0 3.5px currentColor;
  font-family:"Yuji Syuku","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:27px; line-height:1; font-weight:400;
  transform:rotate(var(--ht,-12deg));
  -webkit-mask-image:radial-gradient(circle at 72% 78%, rgba(0,0,0,.62) 0, #000 58%);
          mask-image:radial-gradient(circle at 72% 78%, rgba(0,0,0,.62) 0, #000 58%);
  pointer-events:none;
}
.hanko span{transform:translateY(-1px);}
.pol.done .t{padding-right:30px;}
.sheet .hanko{top:22px; right:18px; width:62px; height:62px; font-size:34px; --ht:-9deg;}
.sheet.done h2{padding-right:66px;}

/* manage categories */
.catrow{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1.5px dashed var(--paper-line);}
.catrow .dotc{width:14px; height:14px; border-radius:50%; flex:none;}
.catrow .nm{flex:1; min-width:0; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.catrow .nm small{display:block; font-weight:500; font-size:12px; color:var(--ink-faint);}
.catrow .btn{padding:6px 12px; font-size:13px;}
.catedit{padding:12px 0 6px; border-bottom:1.5px dashed var(--paper-line);}
.chip.ghost{border-style:dashed; color:var(--chalk-soft);}

/* new category panel */
.newcat{border:2px dashed var(--paper-line); border-radius:10px; padding:14px 14px 4px; margin:-4px 0 15px; background:#fff;}
.newcat .row2{grid-template-columns:1fr 92px;}
.swatches{display:flex; gap:8px; flex-wrap:wrap;}
.sw{appearance:none; width:30px; height:30px; border-radius:50%; border:2px solid rgba(30,28,36,.15); cursor:pointer; padding:0;}
.sw[aria-pressed="true"]{border-color:var(--ink); box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--ink);}

.empty{border:2px dashed var(--page-line); border-radius:6px; padding:34px 22px; text-align:center; color:var(--chalk-soft); margin-top:30px;}
.empty h3{font-family:var(--hand); font-size:36px; line-height:1; color:var(--chalk); margin:0 0 8px; font-weight:700;}
.empty p{margin:0 auto 16px; max-width:36ch; font-size:14px;}

/* ---------- buttons ---------- */
.btn{
  appearance:none; cursor:pointer; font-weight:700; font-size:14.5px; line-height:1.3;
  border:2px solid var(--ink); border-radius:999px; padding:9px 18px;
  background:var(--paper); color:var(--ink);
}
.btn.primary{background:var(--ink); color:var(--paper);}
.btn.gold{background:var(--gold); color:var(--ink);}
.btn.flat{border-color:transparent; background:transparent; color:var(--rose); padding-inline:4px;}
.btn[disabled]{opacity:.55; cursor:not-allowed;}
.fab{
  position:fixed; left:50%; transform:translateX(-50%); z-index:40;
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  border:0; padding:13px 26px; font-size:16px; box-shadow:0 12px 26px -6px rgba(0,0,0,.85);
}

/* ---------- sheets (album pages) ---------- */
.veil{position:fixed; inset:0; z-index:60; background:rgba(6,6,9,.74); display:flex; align-items:flex-end; justify-content:center; overflow-y:auto;}
@media (min-width:640px){ .veil{align-items:center; padding:24px;} }
.sheet{
  position:relative; width:100%; max-width:560px; background:var(--paper); color:var(--ink);
  border-radius:16px 16px 0 0; padding:28px 20px calc(26px + env(safe-area-inset-bottom,0px));
  margin-top:50px; box-shadow:0 -10px 30px rgba(0,0,0,.5);
}
@media (min-width:640px){ .sheet{border-radius:4px; margin:0;} }
.sheet .tape{top:-12px;}
.sheet h2{font-family:var(--hand); font-weight:700; font-size:40px; line-height:1; margin:0 0 6px; word-break:break-word;}
.sheet .sub{font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 16px;}
.sheet .chip{color:var(--ink); border-color:var(--paper-line);}
.sheet .chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink);}
label.f{display:block; margin-bottom:15px;}
label.f > span{display:block; font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px;}
input[type=text],input[type=email],input[type=password],input[type=date],textarea,select.full{
  width:100%; font-family:inherit; font-size:16px; color:var(--ink); background:#fff;
  border:2px solid var(--ink); border-radius:8px; padding:10px 12px; color-scheme:light;
}
textarea{resize:vertical; min-height:80px; line-height:1.55;}
.filepick{display:block; font-size:14px; color:var(--ink);}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:430px){ .row2{grid-template-columns:1fr;} }
.acts{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:6px;}
.acts .spacer{flex:1;}
.facts{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; font-size:13px; color:var(--ink-soft); font-weight:500;}
.pill{display:inline-flex; align-items:center; gap:5px; background:var(--soft,var(--paper-2)); color:var(--ink); font-weight:700; font-size:12.5px; padding:3px 10px; border-radius:999px;}
.pill.plain{background:var(--paper-2);}
.body-note{white-space:pre-wrap; color:var(--ink-soft); margin:0 0 16px;}
.memory-note{font-family:var(--hand); font-size:25px; line-height:1.15; white-space:pre-wrap; margin:0 0 18px; color:var(--ink); padding:2px 0 2px 14px; border-left:3px solid var(--tape,var(--rose));}
.gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:16px 14px; margin:8px 0 20px;}
.thumb{
  appearance:none; border:0; padding:5px 5px 16px; background:#fff; cursor:zoom-in;
  box-shadow:0 8px 14px -8px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.2);
  transform:rotate(var(--tilt,0deg)); transition:transform .15s ease;
}
.thumb:hover{transform:rotate(0deg) scale(1.04);}
.thumb img{display:block; width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--paper-2);}
.note{font-size:13px; color:var(--ink-soft); margin:10px 0 0;}
.err{font-size:13.5px; color:#fff; background:var(--rose); border-radius:8px; padding:9px 12px; margin:12px 0 0;}

/* ---------- ひとこと (a word each) ---------- */
.hk-sec{border-top:1.5px dashed var(--paper-line); margin-top:4px; padding-top:16px;}
.hk-head{display:flex; align-items:baseline; gap:8px; margin-bottom:12px;}
.hk-head b{font-family:"Yomogi",var(--ui); font-size:17px; font-weight:700; color:var(--ink);}
.hk-head small{font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint);}
.hk{margin:0 0 15px; padding-left:13px; border-left:3px solid var(--tape,var(--rose));}
.hk .txt{font-family:var(--hand); font-size:23px; line-height:1.2; color:var(--ink); white-space:pre-wrap;}
.hk .by{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:5px; font-size:12px; font-weight:700; color:var(--ink-faint);}
.hk .by .mini{appearance:none; background:none; border:0; padding:0; cursor:pointer; font:inherit; color:var(--ink-faint); text-decoration:underline; text-underline-offset:3px;}
.hk .by .mini:hover{color:var(--ink);}
.hk.mine{border-left-style:double; border-left-width:5px;}
.hk-none{font-size:13.5px; color:var(--ink-faint); margin:0 0 14px;}

/* ---------- full-screen photo viewer ---------- */
.lb{
  position:fixed; inset:0; z-index:90; background:rgba(6,6,8,.97); color:var(--chalk);
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.lb-top{display:flex; align-items:center; gap:10px; padding:12px 14px;}
.lb-count{font-weight:700; font-size:13px; color:var(--chalk-soft); font-variant-numeric:tabular-nums;}
.lb-top .sp{flex:1;}
.lb-btn{appearance:none; border:1.5px solid rgba(255,255,255,.25); background:rgba(255,255,255,.07); color:var(--chalk); border-radius:999px; padding:7px 14px; font-weight:700; font-size:13.5px; cursor:pointer;}
.lb-stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative; padding:0 12px;}
.lb-stage img{
  display:block; max-width:100%; max-height:calc(100vh - 170px); max-height:calc(100dvh - 170px);
  object-fit:contain; border:6px solid #fff; box-shadow:0 20px 40px rgba(0,0,0,.6); background:#222;
}
.lb-nav{position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.16); color:#fff; font-size:22px; line-height:1; cursor:pointer;}
.lb-prev{left:10px;} .lb-next{right:10px;}
.lb-cap{font-family:var(--hand); font-size:27px; line-height:1.1; text-align:center; padding:10px 18px 16px; color:var(--chalk);}
.lb-cap small{display:block; font-family:var(--ui); font-size:12px; font-weight:700; color:var(--chalk-faint); margin-top:4px;}

/* ---------- sign-in / setup ---------- */
.gate{min-height:100%; display:flex; align-items:center; justify-content:center; padding:36px 18px;}
.gatecard{
  position:relative; width:100%; max-width:400px; background:var(--paper); color:var(--ink);
  padding:32px 22px 24px; border-radius:2px; transform:rotate(-1deg);
  box-shadow:0 22px 40px -14px rgba(0,0,0,.85);
}
.gatecard h1{color:var(--ink); font-size:56px; margin:4px 0 6px;}
.gatecard .jp-sub{color:var(--rose);}
.gatecard p, .gatecard ol{color:var(--ink-soft); font-size:14px;}
.gatecard ol{padding-left:20px;}
.gatecard code{font-family:ui-monospace,monospace; font-size:12.5px; background:var(--paper-2); padding:1px 5px; border-radius:4px; word-break:break-all;}
.gatecard .route{color:var(--ink-faint);}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<div id="gate" class="gate" hidden><div class="gatecard" id="gatecard" style="--tape:#FF7EA6"></div></div>

<div id="app" hidden>
  <div class="wrap">
    <header>
      <div class="route"><span>🇧🇷 Brazil</span><i class="ln"></i><span>✈</span><i class="ln"></i><span>Japan 🇯🇵</span></div>
      <h1>Our Love Journal</h1>
      <p class="jp-sub">ふたりのアルバム</p>
      <p class="lede">Everything we still want to do together, and every one we've already done, with the photos to prove it.</p>
      <div class="stats" id="stats"></div>
      <div class="whobar">
        <span id="me-label"></span>
        <button class="linkbtn" id="edit-me">change</button>
        <span style="flex:1"></span>
        <button class="linkbtn" id="signout">sign out</button>
      </div>
    </header>

    <div class="search">
      <span class="mag" aria-hidden="true">🔍</span>
      <input id="q" type="search" autocomplete="off" placeholder="Search our album…" aria-label="Search entry titles">
      <button id="q-clear" type="button" aria-label="Clear search" hidden>✕</button>
    </div>
    <div class="tabs" role="tablist" aria-label="View">
      <button class="tab" role="tab" id="tab-all" aria-selected="true">Everything</button>
      <button class="tab" role="tab" id="tab-open" aria-selected="false">Dreams</button>
      <button class="tab" role="tab" id="tab-done" aria-selected="false">Memories</button>
    </div>

    <div class="filters">
      <button class="chip" data-place="all" aria-pressed="true">Everywhere</button>
      <button class="chip" data-place="br" aria-pressed="false">🇧🇷 Brazil</button>
      <button class="chip" data-place="jp" aria-pressed="false">🇯🇵 Japan</button>
      <button class="chip" data-place="any" aria-pressed="false">💫 Anywhere</button>
      <select class="mini" id="f-who" aria-label="Filter by who added it"><option value="all">Anyone's idea</option></select>
    </div>
    <div class="filters scroll" id="cats" aria-label="Categories"></div>

    <div id="list" class="grid" aria-live="polite"></div>
  </div>
  <button class="btn fab" id="add-btn">＋ Add a dream</button>
</div>

<div id="modal"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";

var BUCKET = "journal-photos";
var CATS = [
  {id:"Activities", emoji:"👫", color:"#7FA7FF"},
  {id:"Food",       emoji:"🍕", color:"#FF9F5A"},
  {id:"Love",       emoji:"💕", color:"#FF7EA6"},

/* ---------------- helpers ---------------- */
function el(t,c,x){ var n=document.createElement(t); if(c) n.className=c; if(x!=null) n.textContent=x; return n; }
function allCats(){ return CATS.concat(customCats); }
function catInfo(c){
  var l=allCats();
  for(var i=0;i<l.length;i++) if(l[i].id===c) return l[i];
  return {id:c||"Other", emoji:"📌", color:"#C9A27E"};
}
function catEmoji(c){ return catInfo(c).emoji; }
function softOf(hex){
  var m=/^#?([0-9a-f]{6})$/i.exec(hex||""); if(!m) return "#EFE9DC";
  var n=parseInt(m[1],16), r=n>>16&255, g=n>>8&255, b=n&255;
  function mix(v){ return Math.round(v+(255-v)*.78); }
  return "rgb("+mix(r)+","+mix(g)+","+mix(b)+")";
}
function applyCat(node, c){
  var info=catInfo(c);
  node.style.setProperty("--tape", info.color);
  node.style.setProperty("--soft", softOf(info.color));
}
function hanko(){ var s=el("span","hanko"); s.setAttribute("role","img"); s.setAttribute("aria-label","Done"); s.appendChild(el("span",null,"済")); return s; }
function placeOf(e){ return PLACES[e.place]||PLACES.any; }
function fmt(d){ if(!d) return ""; var x=new Date(String(d).length===10 ? d+"T12:00:00" : d); return isNaN(x)?"":x.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); }
function todayISO(){ var d=new Date(),p=function(n){return(n<10?"0":"")+n;}; return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function rand(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function find(id){ for(var i=0;i<entries.length;i++) if(entries[i].id===id) return entries[i]; return null; }
function hash(s){ var h=0; s=String(s||""); for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }
function tiltFor(id){ return (((hash(id)%9)-4)*0.45).toFixed(2)+"deg"; }
function tapeFor(id){ return (((hash(id+"t")%11)-5)*1.1).toFixed(1)+"deg"; }
function personLabel(id){
  if(!id) return "our original list";
  if(session && id===session.user.id) return "you";
  var p=profiles[id];
  return (p && p.name) ? ((p.emoji? p.emoji+" " : "")+p.name) : "your person";
}

/* ---------------- data ---------------- */
function loadAll(){
  return Promise.all([
    sb.from("entries").select("*"),
    sb.from("profiles").select("*"),
    sb.from("categories").select("*"),
    sb.from("notes").select("*")
  ]).then(function(res){
    if(res[3] && !res[3].error){
      notesOn=true; notesBy={};
      (res[3].data||[]).slice().sort(function(a,b){ return String(a.created_at||"").localeCompare(String(b.created_at||"")); })
        .forEach(function(n){ (notesBy[n.entry_id]=notesBy[n.entry_id]||[]).push(n); });
    }else if(res[3] && res[3].error){ notesOn=false; }
    if(res[2] && !res[2].error){
      customCats = (res[2].data||[]).filter(function(c){ return c && c.name; }).map(function(c){
        return {id:c.name, emoji:c.emoji||"📌", color:c.color||"#C9A27E", custom:true};
      }).sort(function(a,b){ return String(a.id).localeCompare(String(b.id)); });
      catSig="";
    }
    if(!res[0].error) entries = res[0].data || [];
    if(!res[1].error){
      profiles={};
      (res[1].data||[]).forEach(function(p){ profiles[p.id]=p; });
      myProfile = session ? (profiles[session.user.id]||null) : null;
    }
    loaded=true;
    renderMe();
    render();
    if(session && !myProfile && !modalEl.firstChild) askWhoYouAre(true);
  });
}

function signPaths(paths){
  var need=[], now=Date.now();
  paths.forEach(function(p){ if(p && (!signed[p] || signed[p].exp < now+60000) && need.indexOf(p)<0) need.push(p); });
  if(!need.length) return Promise.resolve(false);
  return sb.storage.from(BUCKET).createSignedUrls(need, 3600).then(function(r){
    var got=false;
    (r.data||[]).forEach(function(d){
      if(d && d.signedUrl){ signed[d.path]={url:d.signedUrl, exp:Date.now()+3400*1000}; got=true; }
    });
    return got;
  }).catch(function(){ return false; });
}

/* ---------------- render ---------------- */
function visible(){
  return entries.filter(function(e){
    if(q){
      if(String(e.title||"").toLowerCase().indexOf(q)<0) return false;
    }else{
      if(view==="open" && e.done) return false;
      if(view==="done" && !e.done) return false;
    }
    if(fPlace!=="all" && e.place!==fPlace) return false;
    if(fCat!=="all" && e.category!==fCat) return false;
    if(fWho!=="all"){
      if(fWho==="none" ? !!e.created_by : e.created_by!==fWho) return false;
    }
    return true;
  }).sort(function(a,b){
    if(a.done!==b.done) return a.done ? -1 : 1;
    var k = a.done ? String(b.done_at||"").localeCompare(String(a.done_at||""))
                   : String(b.created_at||"").localeCompare(String(a.created_at||""));
    return k || String(a.title||"").localeCompare(String(b.title||""));
  });
}

function renderStats(){
  var open=0, done=0, photos=0;
  entries.forEach(function(e){ if(e.done) done++; else open++; photos+=(e.photos||[]).length; });
  statsEl.innerHTML="";
  [[open,"still to do","-1.5deg",""],[done,"memories made","1.2deg","var(--rose)"],[photos,"photos kept","-.6deg",""]].forEach(function(s){
    var d=el("div","stat");
    d.style.setProperty("--r",s[2]);
    if(s[3]) d.style.setProperty("--num",s[3]);
    d.appendChild(el("b",null,String(s[0])));
    d.appendChild(el("span",null,s[1]));
    statsEl.appendChild(d);
  });
}

function renderFilters(){
  var used={}; entries.forEach(function(e){ if(e.category) used[e.category]=true; });
  var list=allCats().filter(function(c){ return used[c.id]; });
  Object.keys(used).forEach(function(k){ if(!list.some(function(c){return c.id===k;})) list.push(catInfo(k)); });
  if(fCat!=="all" && !used[fCat]) fCat="all";
  var sig=list.map(function(c){return c.id+c.emoji+c.color;}).join("|");
  if(sig!==catSig){
    catSig=sig;
    catsEl.innerHTML="";
    var all=el("button","chip","All categories"); all.type="button"; all.setAttribute("data-cat","all");
    catsEl.appendChild(all);
    list.forEach(function(c){
      var b=el("button","chip",c.emoji+" "+c.id); b.type="button"; b.setAttribute("data-cat",c.id);
      catsEl.appendChild(b);
    });
    Array.prototype.forEach.call(catsEl.children,function(b){
      b.addEventListener("click",function(){ fCat=b.getAttribute("data-cat"); render(); });
    });
    var mg=el("button","chip ghost","✎ Edit categories"); mg.type="button";
    mg.addEventListener("click",openManageCats);
    catsEl.appendChild(mg);
  }
  Array.prototype.forEach.call(catsEl.querySelectorAll("[data-cat]"),function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-cat")===fCat ? "true":"false");
  });

  var w=document.getElementById("f-who"), curW=w.value;
  var ids={}, anyNull=false;
  entries.forEach(function(e){ if(e.created_by) ids[e.created_by]=true; else anyNull=true; });
  w.innerHTML=""; w.appendChild(new Option("Anyone's idea","all"));
  Object.keys(ids).forEach(function(i){
    w.appendChild(new Option(i===(session&&session.user.id) ? "Added by me" : ("By "+personLabel(i)), i));
  });
  if(anyNull) w.appendChild(new Option("From our Docs list","none"));
  w.value = curW && [].some.call(w.options,function(o){return o.value===curW;}) ? curW : "all";
  fWho=w.value;
}

function card(e){
  var b=el("button","pol"+(e.done?" done":""));
  b.type="button";
  applyCat(b, e.category);
  b.style.setProperty("--tilt",tiltFor(e.id));
  var tape=el("span","tape"); tape.style.setProperty("--tt",tapeFor(e.id)); b.appendChild(tape);

  var photos=e.photos||[];
  var cover=photos[0];
  var shot=el("div","shot");
  if(cover && signed[cover]){
    var img=el("img"); img.src=signed[cover].url; img.alt=""; img.loading="lazy";
    shot.appendChild(img);
  }else{
    var ph=el("div","ph");
    ph.appendChild(el("span","big",catEmoji(e.category)));
    ph.appendChild(el("span","yet", cover ? "…" : (e.done ? "add a photo" : "not yet")));
    shot.appendChild(ph);
  }
  shot.appendChild(el("span","flag",placeOf(e).flag));
  if(photos.length>1) shot.appendChild(el("span","count","📷 "+photos.length));
  b.appendChild(shot);

  var cap=el("div","cap");
  cap.style.position="relative";
  if(e.done){ var hk=hanko(); hk.style.setProperty("--ht",(((hash(e.id+"h")%13)-6)*2.2-8).toFixed(1)+"deg"); cap.appendChild(hk); }
  cap.appendChild(el("span","t",e.title||"Untitled"));
  var nCount=(notesBy[e.id]||[]).length;
  cap.appendChild(el("span","m", e.done
    ? catEmoji(e.category)+" "+fmt(e.done_at)+(nCount?"  ✍ "+nCount:"")
    : catEmoji(e.category)+" "+(e.category||"")+" · "+personLabel(e.created_by)));
  b.appendChild(cap);

  b.addEventListener("click",function(){ openDetail(e.id); });
  return b;
}

function render(){
  renderStats(); renderFilters();
  var rows=visible();

  document.getElementById("q-clear").hidden = !q;
  document.getElementById("add-btn").hidden = !!q;
  document.querySelector(".tabs").className = "tabs"+(q?" searching":"");

  listEl.innerHTML="";
  listEl.className = rows.length ? "grid" : "";

  if(!loaded){ listEl.appendChild(el("p","note","Opening the album…")); return; }

  if(!rows.length){
    var box=el("div","empty");
    if(!entries.length){
      box.appendChild(el("h3",null,"An empty album"));
      box.appendChild(el("p",null,"Add the first thing you want to do together. The tiny ones count the most."));
      var s=el("button","btn gold","＋ Add the first one"); s.type="button";
      s.addEventListener("click",function(){ openForm(null,null); });
      box.appendChild(s);
    }else if(q){
      box.appendChild(el("h3",null,"Nothing found"));
      box.appendChild(el("p",null,"No title has \u201C"+q+"\u201D in it. Check the place and category filters too."));
      var cl=el("button","btn gold","Clear search"); cl.type="button";
      cl.addEventListener("click",clearSearch);
      box.appendChild(cl);
    }else if(view==="done"){
      box.appendChild(el("h3",null,"No memories yet"));
      box.appendChild(el("p",null,"Finish something from Dreams, tap “We did it”, and it lands here with the photos."));
    }else{
      box.appendChild(el("h3",null,"Nothing matches"));
      box.appendChild(el("p",null,"Try another place or category."));
    }
    listEl.appendChild(box);
    return;
  }

  rows.forEach(function(e){ listEl.appendChild(card(e)); });

  var covers=rows.map(function(e){ return (e.photos||[])[0]; }).filter(Boolean);
  if(covers.length) signPaths(covers).then(function(got){ if(got) render(); });
}

/* ---------------- photos ---------------- */
function shrink(file){
  return new Promise(function(resolve){
    if(!/^image\//.test(file.type) || /svg/.test(file.type) || !window.createImageBitmap) return resolve(file);
    createImageBitmap(file).then(function(bmp){
      var max=2000, scale=Math.min(1, max/Math.max(bmp.width,bmp.height));
      if(scale===1 && file.size < 3*1024*1024){ if(bmp.close) bmp.close(); return resolve(file); }
      var w=Math.round(bmp.width*scale), h=Math.round(bmp.height*scale);
      var c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(bmp,0,0,w,h);
      if(bmp.close) bmp.close();
      c.toBlob(function(blob){ resolve(blob && blob.size<file.size ? blob : file); },"image/jpeg",0.86);
    }).catch(function(){ resolve(file); });
  });
}

function uploadPhotos(entry, files, onStatus){
  var list=Array.prototype.slice.call(files), paths=[];
  var chain=Promise.resolve();
  list.forEach(function(f,i){
    chain=chain.then(function(){
      onStatus("Uploading photo "+(i+1)+" of "+list.length+"…");
      return shrink(f).then(function(blob){
        var ext = /png$/.test(blob.type) ? "png" : "jpg";
        var path = entry.id+"/"+rand()+"."+ext;
        return sb.storage.from(BUCKET).upload(path, blob, {contentType: blob.type||"image/jpeg", upsert:false})
          .then(function(r){ if(r.error) throw r.error; paths.push(path); });
      });
    });
  });
  return chain.then(function(){
    var fresh=find(entry.id)||entry;
    var next=(fresh.photos||[]).concat(paths);
    return sb.from("entries").update({photos:next, updated_at:new Date().toISOString()}).eq("id",entry.id)
      .then(function(r){ if(r.error) throw r.error; });
  });
}

/* ---------------- full-screen viewer ---------------- */
function openLightbox(entryId, start){
  var e=find(entryId); if(!e) return;
  var photos=(e.photos||[]).slice(); if(!photos.length) return;
  var i=Math.max(0, Math.min(start||0, photos.length-1));

  var lb=el("div","lb");
  lb.setAttribute("role","dialog"); lb.setAttribute("aria-modal","true"); lb.setAttribute("aria-label","Photo viewer");

  var top=el("div","lb-top");
  var count=el("span","lb-count");
  var rm=el("button","lb-btn","Remove"); rm.type="button";
  var close=el("button","lb-btn","✕ Close"); close.type="button";
  top.appendChild(count); top.appendChild(el("span","sp")); top.appendChild(rm); top.appendChild(close);

  var stage=el("div","lb-stage");
  var img=el("img");
  var prev=el("button","lb-nav lb-prev","‹"); prev.type="button"; prev.setAttribute("aria-label","Previous photo");
  var next=el("button","lb-nav lb-next","›"); next.type="button"; next.setAttribute("aria-label","Next photo");
  stage.appendChild(img); stage.appendChild(prev); stage.appendChild(next);

  var cap=el("div","lb-cap", e.title||"");
  if(e.done_at) cap.appendChild(el("small",null,fmt(e.done_at)));

  lb.appendChild(top); lb.appendChild(stage); lb.appendChild(cap);

  function show(){
    var p=photos[i];
    count.textContent=(i+1)+" / "+photos.length;
    img.alt="Photo "+(i+1)+" from "+(e.title||"this memory");
    img.src = signed[p] ? signed[p].url : "";
    prev.hidden = next.hidden = photos.length<2;
    if(!signed[p]) signPaths([p]).then(function(){ if(photos[i]===p && signed[p]) img.src=signed[p].url; });
  }
  function go(d){ i=(i+d+photos.length)%photos.length; show(); }
  function shut(){ document.removeEventListener("keydown",key,true); lb.remove(); }
  function key(ev){
    if(ev.key==="Escape"){ ev.stopPropagation(); shut(); }
    else if(ev.key==="ArrowLeft") go(-1);
    else if(ev.key==="ArrowRight") go(1);
  }
  document.addEventListener("keydown",key,true);
  prev.addEventListener("click",function(ev){ ev.stopPropagation(); go(-1); });
  next.addEventListener("click",function(ev){ ev.stopPropagation(); go(1); });
  close.addEventListener("click",shut);
  stage.addEventListener("click",function(ev){ if(ev.target===stage) shut(); });

  var sx=null, sy=null;
  stage.addEventListener("touchstart",function(ev){ sx=ev.touches[0].clientX; sy=ev.touches[0].clientY; },{passive:true});
  stage.addEventListener("touchend",function(ev){
    if(sx==null) return;
    var dx=ev.changedTouches[0].clientX-sx, dy=ev.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)) go(dx<0?1:-1);
    else if(dy>90 && Math.abs(dy)>Math.abs(dx)) shut();
    sx=sy=null;
  });

  rm.addEventListener("click",function(){
    if(!window.confirm("Remove this photo for good?")) return;
    var p=photos[i];
    var fresh=find(e.id)||e;
    var nextList=(fresh.photos||[]).filter(function(x){return x!==p;});
    rm.disabled=true;
    sb.from("entries").update({photos:nextList}).eq("id",e.id).then(function(r){
      if(r.error) throw r.error;
      return sb.storage.from(BUCKET).remove([p]);
    }).then(function(){ return loadAll(); }).then(function(){
      shut(); openDetail(e.id);
    }).catch(function(){ rm.disabled=false; window.alert("Couldn't remove that photo. Try again."); });
  });

  document.body.appendChild(lb);
  show();
  close.focus({preventScroll:true});
}

/* ---------------- ひとこと: one word each, signed ---------------- */
function buildHitokoto(e){
  var sec=el("div","hk-sec");
  var head=el("div","hk-head");
  head.appendChild(el("b",null,"ひとこと"));
  head.appendChild(el("small",null,"a word from each of us"));
  sec.appendChild(head);

  var listBox=el("div");
  var errP=el("p","err"); errP.hidden=true;
  var actionBox=el("div","acts"); actionBox.style.marginTop="0";
  sec.appendChild(listBox); sec.appendChild(errP); sec.appendChild(actionBox);

  function fail(t){ errP.textContent=t; errP.hidden=false; }
  function mine(n){ return session && n.author===session.user.id; }

  function draw(){
    listBox.innerHTML=""; actionBox.innerHTML=""; errP.hidden=true;
    if(!notesOn){
      listBox.appendChild(el("p","hk-none","Notes aren't set up in the database yet."));
      return;
    }
    var list=notesBy[e.id]||[];
    if(!list.length) listBox.appendChild(el("p","hk-none","Nothing written here yet. What do you remember about it?"));
    list.forEach(function(n){
      var q=el("div","hk"+(mine(n)?" mine":""));
      q.appendChild(el("div","txt",n.text||""));
      var by=el("div","by");
      var p=profiles[n.author];
      var who=p ? ((p.emoji?p.emoji+" ":"")+p.name) : "someone";
      by.appendChild(el("span",null,"— by "+who+(n.created_at?" · "+fmt(n.created_at):"")));
      if(mine(n)){
        var ed=el("button","mini","edit"); ed.type="button";
        var dl=el("button","mini","delete"); dl.type="button";
        by.appendChild(ed); by.appendChild(dl);
        ed.addEventListener("click",function(){ compose(n); });
        dl.addEventListener("click",function(){
          if(!window.confirm("Delete your note?")) return;
          sb.from("notes").delete().eq("id",n.id).then(function(r){
            if(r.error) throw r.error;
            return loadAll();
          }).then(draw).catch(function(ex){ fail("Couldn't delete it: "+((ex&&ex.message)||"try again")); });
        });
      }
      q.appendChild(by);
      listBox.appendChild(q);
    });
    if(notesOn){
      var add=el("button","btn","✍ Write yours"); add.type="button";
      add.addEventListener("click",function(){ compose(null); });
      actionBox.appendChild(add);
    }
  }

  function compose(existing){
    listBox.innerHTML=""; actionBox.innerHTML=""; errP.hidden=true;
    var list=(notesBy[e.id]||[]).filter(function(n){ return !existing || n.id!==existing.id; });
    list.forEach(function(n){
      var q=el("div","hk"+(mine(n)?" mine":""));
      q.appendChild(el("div","txt",n.text||""));
      var p=profiles[n.author];
      q.appendChild(el("div","by","— by "+(p?((p.emoji?p.emoji+" ":"")+p.name):"someone")+(n.created_at?" · "+fmt(n.created_at):"")));
      listBox.appendChild(q);
    });
    var lab=el("label","f");
    lab.appendChild(el("span",null, existing ? "Your note" : "Your ひとこと"));
    var ta=el("textarea"); ta.id="hk-text"; ta.maxLength=2000;
    ta.placeholder="What I keep thinking about is…";
    ta.value=existing ? (existing.text||"") : "";
    lab.appendChild(ta); listBox.appendChild(lab);
    ta.focus({preventScroll:true});

    var save=el("button","btn primary", existing?"Save":"Add it"); save.type="button";
    var cancel=el("button","btn","Cancel"); cancel.type="button";
    cancel.addEventListener("click",draw);
    actionBox.appendChild(save); actionBox.appendChild(cancel);

    save.addEventListener("click",function(){
      var text=ta.value.trim();
      if(!text){ fail("Write something first."); ta.focus(); return; }
      save.disabled=true; save.textContent="Saving…"; errP.hidden=true;
      var p = existing
        ? sb.from("notes").update({text:text}).eq("id",existing.id)
        : sb.from("notes").insert({entry_id:e.id, author:session.user.id, text:text});
      p.then(function(r){
        if(r.error) throw r.error;
        return loadAll();
      }).then(draw).catch(function(ex){
        save.disabled=false; save.textContent= existing?"Save":"Add it";
        fail(/relation|does not exist|schema cache/i.test((ex&&ex.message)||"")
          ? "Notes aren't set up in the database yet. Run notes.sql in Supabase once."
          : "Couldn't save it: "+((ex&&ex.message)||"try again"));
      });
    });
  }

  draw();
  return sec;
}

    sheet.appendChild(el("h2",null,"🎉 We did it"));
    sheet.appendChild(el("p","sub",e.title||""));

    var lD=el("label","f"); lD.appendChild(el("span",null,"When"));
    var iD=el("input"); iD.type="date"; iD.id="c-date"; iD.value=todayISO();
    lD.appendChild(iD); sheet.appendChild(lD);

    var lN=el("label","f"); lN.appendChild(el("span",null,"What do you want to remember about it"));
    var iN=el("textarea"); iN.id="c-note"; iN.maxLength=4000;
    iN.placeholder="It rained the whole time and we didn't care.";
    lN.appendChild(iN); sheet.appendChild(lN);

    var lP=el("label","f"); lP.appendChild(el("span",null,"Photos (you can add more later)"));
    var iP=el("input","filepick"); iP.type="file"; iP.id="c-photos"; iP.accept="image/*"; iP.multiple=true;
    lP.appendChild(iP); sheet.appendChild(lP);

    var status=el("p","note"); status.hidden=true; sheet.appendChild(status);
    var err=el("p","err"); err.hidden=true; sheet.appendChild(err);

    var acts=el("div","acts");
    var save=el("button","btn gold","Save this memory"); save.type="button";
    var cancel=el("button","btn","Not yet"); cancel.type="button"; cancel.addEventListener("click",closeModal);
    acts.appendChild(save); acts.appendChild(cancel); sheet.appendChild(acts);

    save.addEventListener("click",function(){
      save.disabled=true; save.textContent="Saving…"; err.hidden=true;
      sb.from("entries").update({
        done:true, done_at:iD.value||todayISO(), memory_note:iN.value.trim(), updated_at:new Date().toISOString()
      }).eq("id",e.id).then(function(r){
        if(r.error) throw r.error;
        if(!iP.files || !iP.files.length) return null;
        return uploadPhotos(e, iP.files, function(t){ status.textContent=t; status.hidden=!t; });
      }).then(function(){
        return loadAll();
      }).then(function(){
        closeModal(); view="done"; syncTabs(); render();
      }).catch(function(ex){
        save.disabled=false; save.textContent="Save this memory"; status.hidden=true;
        err.textContent="Something didn't save: "+((ex&&ex.message)||"try again"); err.hidden=false;
      });
    });
  });
}

/* ---------------- controls ---------------- */
var qInput=document.getElementById("q");
function clearSearch(){ q=""; qInput.value=""; render(); qInput.focus({preventScroll:true}); }
qInput.addEventListener("input",function(){ q=qInput.value.trim().toLowerCase(); render(); });
qInput.addEventListener("keydown",function(e){ if(e.key==="Escape"){ e.stopPropagation(); clearSearch(); } });
document.getElementById("q-clear").addEventListener("click",clearSearch);

var TABS=[["all","tab-all"],["open","tab-open"],["done","tab-done"]];
function syncTabs(){ TABS.forEach(function(t){ document.getElementById(t[1]).setAttribute("aria-selected", view===t[0]?"true":"false"); }); }
TABS.forEach(function(t){ document.getElementById(t[1]).addEventListener("click",function(){
  view=t[0]; q=""; qInput.value=""; syncTabs(); render();
}); });
Array.prototype.forEach.call(document.querySelectorAll("[data-place]"),function(btn){
  btn.addEventListener("click",function(){
    fPlace=btn.getAttribute("data-place");
    Array.prototype.forEach.call(document.querySelectorAll("[data-place]"),function(b){
      b.setAttribute("aria-pressed", b===btn?"true":"false");
    });
    render();
  });
});
document.getElementById("f-who").addEventListener("change",function(){ fWho=this.value; render(); });
document.getElementById("add-btn").addEventListener("click",function(){ openForm(null,null); });
document.getElementById("edit-me").addEventListener("click",function(){ askWhoYouAre(false); });
document.getElementById("signout").addEventListener("click",function(){ sb.auth.signOut(); });

/* ---------------- boot ---------------- */
if(!window.supabase || !SUPA_URL || !SUPA_KEY || /^PASTE_/.test(SUPA_URL) || /^PASTE_/.test(SUPA_KEY)){
  setupScreen();
}else{
  sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  var channel=null;

  function start(){
    if(!session){
      gate.hidden=false; app.hidden=true; modalEl.innerHTML=""; document.body.style.overflow="";
      loginScreen(null);
      return;
    }
    gate.hidden=true; app.hidden=false;
    loaded=false; render();
    loadAll();
    if(!channel){
      channel = sb.channel("journal")
        .on("postgres_changes",{event:"*",schema:"public",table:"entries"}, function(){ loadAll(); })
        .subscribe();
    }
  }

  sb.auth.getSession().then(function(r){
    session = r.data ? r.data.session : null;
    start();
  });

  sb.auth.onAuthStateChange(function(_evt, s){
    var was = session ? session.user.id : null;
    session = s;
    if((session ? session.user.id : null) !== was) start();
  });
}
})();
</script>
</body>
</html>
